name: CI

# Build, typecheck and test on Node 24 without runtime generation or Bun.
# Tests include persistent Pi recovery/ownership, money policy, event admission
# and the tool table.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 15
    name: Typecheck + test + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm must be on PATH before setup-node so `cache: pnpm` can resolve the
      # store path.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6.0.10
        with:
          # Use the exact packageManager pin in package.json.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      # Install also builds dist/: pnpm runs the root `prepare` (`pnpm build`).
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Reads dist/, which the test step's global setup has just rebuilt.
      - name: Tool and CLI parity
        run: node scripts/check-cli-parity.mjs

      # The wrap gate reads code blocks out of a real CommonMark parse rather
      # than guessing where fences end, so it needs python3-markdown-it. Ubuntu
      # ships it, and apt keeps the runner's python PEP 668-clean.
      - name: Install the prose wrap gate's parser
        run: |
          if ! python3 -c "import markdown_it" >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-markdown-it
          fi

      - name: Skill files
        run: bash scripts/check-agent-skills.sh

      - name: Prose wraps
        run: python3 scripts/check-prose-wraps.py

      - name: Lessons ledger
        run: python3 scripts/check-lessons-ledger.py
